[project]
name = "poker-engine"
version = "0.1.0"
description = "Computation core for MTT poker coaching: ICM, pot odds, PKO bounty EV, equity"
requires-python = ">=3.11"
dependencies = [
    "pokerkit>=0.5",
    "phevaluator>=0.6.0",
    "numpy>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
lobby = ["rapidocr-onnxruntime==1.4.4", "onnxruntime==1.20.1", "pillow==13.0.0"]

[project.scripts]
poker-engine = "poker_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
poker_engine = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
