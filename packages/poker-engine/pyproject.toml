[project]
name = "poker-engine"
version = "0.1.0"
description = "Computation core for MTT poker coaching: ICM, pot odds, PKO bounty EV, equity"
requires-python = ">=3.11"
dependencies = [
    "pokerkit>=0.5",
    "eval7>=0.1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
poker-engine = "poker_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
poker_engine = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# eval7 при импорте зовёт устаревшие имена pyparsing: шум чужого модуля, не наш.
filterwarnings = ["ignore::DeprecationWarning:eval7.rangestring"]
